<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hafıza Kartları</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, sans-serif;
    padding: 16px;
  }
  h1 { font-size: 1.5rem; }
  .hud {
    display: flex;
    gap: 22px;
    color: #94a3b8;
    font-size: .95rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .hud b { color: #4ade80; font-variant-numeric: tabular-nums; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 78px);
    grid-template-rows: repeat(4, 78px);
    gap: 10px;
  }
  .card {
    position: relative;
    cursor: pointer;
    perspective: 600px;
  }
  .card-inner {
    position: absolute;
    inset: 0;
    transition: transform .35s;
    transform-style: preserve-3d;
  }
  .card.open .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    border: 1px solid #334155;
  }
  .back { background: #273449; }
  .back::after { content: '❓'; font-size: 1.4rem; opacity: .5; }
  .front { background: #1e293b; transform: rotateY(180deg); }
  .card.matched .front { background: #14532d; border-color: #166534; }
  .card.matched { animation: pop .4s; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .status { min-height: 1.4em; text-align: center; font-size: 1.02rem; }
  .btn {
    background: #22c55e;
    color: #052e16;
    border: none;
    padding: 10px 24px;
    font-weight: 800;
    border-radius: 10px;
    cursor: pointer;
    font-size: .95rem;
  }
  .btn:hover { background: #4ade80; }
  .diff { display: flex; gap: 8px; }
  .diff button {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    border-radius: 999px;
    padding: 7px 16px;
    font-weight: 700;
    cursor: pointer;
    font-size: .85rem;
  }
  .diff button.active { background: #22c55e; color: #052e16; border-color: transparent; }
  .win {
    background: linear-gradient(135deg, #14532d, #1e293b);
    border: 1px solid #166534;
    border-radius: 12px;
    padding: 12px 18px;
    text-align: center;
  }
  .win b { color: #4ade80; }
</style>
</head>
<body>
  <h1>🧠 Hafıza Kartları</h1>
  <div class="diff" id="diff">
    <button data-n="12">Kolay (6 eş)</button>
    <button data-n="16" class="active">Normal (8 eş)</button>
    <button data-n="24">Zor (12 eş)</button>
  </div>

  <div class="hud">
    <span>Hareket: <b id="moves">0</b></span>
    <span>Süre: <b id="time">0 s</b></span>
    <span>Eşleşen: <b id="pairs">0/8</b></span>
    <span>Rekor (normal): <b id="best">—</b></span>
  </div>

  <div class="board" id="board"></div>
  <div class="status" id="status">Kartları çevir, eşleri bul!</div>
  <button class="btn" id="restartBtn">Yeni Oyun</button>

<script>
const EMOJIS = ['🍉', '🚗', '🐝', '🎸', '🚀', '🐙', '🌵', '🍩', '⚽️', '🦊', '☂️', '🎈', '🔑', '🧲', '🍄', '🦄'];

const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timeEl = document.getElementById('time');
const pairsEl = document.getElementById('pairs');
const bestEl = document.getElementById('best');
const statusEl = document.getElementById('status');

let total = 16, first = null, lock = false;
let moves = 0, matched = 0, seconds = 0, tick = null, won = false;

function bestKey() { return 'memBest_' + total; }

function renderBest() {
  const b = localStorage.getItem(bestKey());
  bestEl.textContent = b ? b + ' hareket' : '—';
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  clearInterval(tick);
  tick = null;
  moves = 0; matched = 0; seconds = 0; first = null; lock = false; won = false;
  movesEl.textContent = 0;
  timeEl.textContent = '0 s';
  pairsEl.textContent = `0/${total / 2}`;
  statusEl.textContent = 'Kartları çevir, eşleri bul!';
  renderBest();

  const chosen = shuffle(EMOJIS.slice()).slice(0, total / 2);
  const deck = shuffle(chosen.flatMap(e => [e, e]));

  boardEl.innerHTML = '';
  deck.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.val = emoji;
    card.innerHTML = `
      <div class="card-inner">
        <div class="face back"></div>
        <div class="face front">${emoji}</div>
      </div>`;
    card.onclick = () => flip(card);
    boardEl.appendChild(card);
  });

  layout();
}

// 4x4, 3x4, 4x6 gibi ızgaralar kaba ama iş görür
function layout() {
  let cols = total <= 12 ? 4 : total <= 16 ? 4 : 6;
  boardEl.style.gridTemplateColumns = `repeat(${cols}, auto)`;
}

function flip(card) {
  if (lock || won || card === first || card.classList.contains('matched') || card.classList.contains('open')) return;

  if (!tick && !won) {
    tick = setInterval(() => {
      seconds++;
      timeEl.textContent = seconds + ' s';
    }, 1000);
  }

  card.classList.add('open');
  if (!first) { first = card; return; }

  moves++;
  movesEl.textContent = moves;
  const a = first, b = card;
  first = null;

  if (a.dataset.val === b.dataset.val) {
    a.classList.add('matched');
    b.classList.add('matched');
    a.classList.remove('open');
    b.classList.remove('open');
    matched++;
    pairsEl.textContent = `${matched}/${total / 2}`;
    if (matched === total / 2) victory();
  } else {
    lock = true;
    setTimeout(() => {
      a.classList.remove('open');
      b.classList.remove('open');
      lock = false;
    }, 700);
  }
}

function victory() {
  won = true;
  clearInterval(tick);
  tick = null;
  statusEl.innerHTML = `<div class="win">Kazandın! 🎉 — <b>${moves} hareket</b>, <b>${seconds} saniye</b></div>`;

  const prev = Number(localStorage.getItem(bestKey()) || Infinity);
  if (moves < prev) {
    localStorage.setItem(bestKey(), moves);
    statusEl.innerHTML += '<div>🏆 Yeni rekor!</div>';
    renderBest();
  }
}

document.getElementById('restartBtn').onclick = start;

document.getElementById('diff').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('#diff button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  total = Number(b.dataset.n);
  start();
});

start();
</script>
</body>
</html>
